server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # connect-src must list the API origin. Tighten this when the API gets a real hostname.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:5000; frame-ancestors 'none'" always;

  location / {
    # Single-page app: unknown paths fall back to index.html.
    try_files $uri $uri/ /index.html;
  }
}
